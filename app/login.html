<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Agri Dash V.01 Kabupaten Kediri</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-page">

    <!-- SISI KIRI: GAMBAR -->
    <div class="login-left">
        <img src="aset/loginKiri.jpg" alt="Ilustrasi Agri Dash" class="login-side-image">
        <h2>Pertanian Maju, Kediri Sejahtera</h2>
        <p>Pantau produksi, harga, dan cuaca dalam satu dashboard.</p>
    </div>

    <!-- SISI KANAN: KOTAK LOGIN FLOATING -->
    <div class="login-right">

        <div class="login-card">

            <div class="login-brand">
                <img src="aset/LOGOFULL.png" alt="Agri Dash" class="login-logo" onerror="this.style.display='none'">
                <h1>Agri Dash <span>V.01</span></h1>
            </div>

            <h2>Selamat Datang!</h2>
            <p class="subtitle">Silakan masuk untuk melanjutkan</p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" autocomplete="username" placeholder="Masukkan username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" autocomplete="current-password" placeholder="Masukkan password" required>
                        <button type="button" id="togglePassword" class="toggle-pass">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div id="errorMsg" class="error-msg" role="alert" aria-live="polite"></div>

                <button type="submit" class="login-btn">
                    Masuk <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <section id="passwordChangePanel" class="password-change-panel" hidden>
                <h3>Ganti Password Awal</h3>
                <p>Password demo harus diganti sebelum dashboard dapat diakses.</p>
                <form id="passwordChangeForm">
                    <div class="form-group">
                        <label for="currentPassword">Password saat ini</label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="currentPassword" autocomplete="current-password" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">Password baru (minimal 12 karakter)</label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-key"></i>
                            <input type="password" id="newPassword" autocomplete="new-password" minlength="12" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirmNewPassword">Ulangi password baru</label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-key"></i>
                            <input type="password" id="confirmNewPassword" autocomplete="new-password" minlength="12" required>
                        </div>
                    </div>
                    <div id="passwordChangeError" class="error-msg" role="alert" aria-live="polite"></div>
                    <button type="submit" class="login-btn">Simpan Password</button>
                </form>
            </section>

        </div>

    </div>

</div>

<script src="auth.js"></script>
<script src="login.js"></script>
</body>
</html>
